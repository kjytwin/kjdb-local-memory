name: Windows build and package checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-local:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          architecture: x64
      - name: Build production and fault-injection DLLs
        shell: pwsh
        run: |
          cmake -S tools/local -B build-local/ci-native -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-local/ci-native --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S tools/local -B build-local/ci-fault -A x64 -DKJM_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-local/ci-fault --config Release
          exit $LASTEXITCODE
      - name: Build allowlisted ZIP and qualify extracted commands
        shell: pwsh
        run: |
          $kjdbPythonRoot = python -c "import sys; print(sys.prefix)"
          python -B tools/local/package_windows.py --destination dist/KJDB-Windows-x64-ci-preview-0.1.1 --library build-local/ci-native/Release/kjdb_memory.dll --python-root $kjdbPythonRoot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:KJDB_TEST_PACKAGE = Join-Path $PWD 'dist/KJDB-Windows-x64-ci-preview-0.1.1'
          $env:KJDB_TEST_LIBRARY = Join-Path $PWD 'build-local/ci-native/Release/kjdb_memory.dll'
          $env:KJDB_TEST_FAULT_LIBRARY = Join-Path $PWD 'build-local/ci-fault/Release/kjdb_memory.dll'
          python -B tools/local/run_validation.py dist/KJDB-Windows-x64-ci-preview-0.1.1.zip
          exit $LASTEXITCODE
      - name: Retain verified candidate and validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KJDB-Windows-x64-ci-preview-0.1.1
          retention-days: 14
          path: |
            dist/KJDB-Windows-x64-ci-preview-0.1.1.zip
            tools/local/VALIDATION.json
            tools/local/VALIDATION.log
